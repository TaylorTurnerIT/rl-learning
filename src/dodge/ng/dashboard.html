<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DQN</title>
  <style>
    :root { color-scheme: dark; }
    body { background: #111318; color: #e7e9ee; font: 14px system-ui, sans-serif; margin: 20px; }
    main { max-width: 760px; margin: auto; }
    header, .controls, .replay-controls { align-items: center; display: flex; gap: 8px; }
    header { justify-content: space-between; margin-bottom: 14px; }
    #state { color: #9ba3b5; }
    .stats { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); }
    .stat { background: #1a1d24; border: 1px solid #292e39; padding: 10px; }
    .label { color: #8f98aa; display: block; font-size: 11px; margin-bottom: 5px; }
    output { font-size: 18px; }
    button, input, select { background: #1a1d24; border: 1px solid #3a4250; color: inherit; padding: 6px 8px; }
    button { cursor: pointer; }
    button:hover { border-color: #7f8da8; }
    .controls { margin: 14px 0; }
    .replay { border-top: 1px solid #292e39; margin-top: 18px; padding-top: 18px; }
    .replay-controls { margin-top: 8px; }
    .replay-comparison { align-items: center; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .comparison-label { color: #8f98aa; font-size: 12px; margin-right: 4px; }
    .replay-role[aria-pressed="true"] { border-color: #29adff; color: #fff; }
    canvas { background: #000; image-rendering: pixelated; margin-top: 12px; width: min(512px, 100%); }
    #frame { flex: 1; }
    @media (max-width: 620px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <main>
    <header><strong>DQN</strong><span id="state">offline</span></header>
    <section class="stats">
      <div class="stat"><span class="label">Step</span><output id="step">—</output></div>
      <div class="stat"><span class="label">Best</span><output id="best">—</output></div>
      <div class="stat"><span class="label">Train</span><output id="train">—</output></div>
      <div class="stat"><span class="label">Holdout</span><output id="holdout">—</output></div>
      <div class="stat"><span class="label">Replay</span><output id="replay-size">—</output></div>
      <div class="stat"><span class="label">Loss</span><output id="loss">—</output></div>
      <div class="stat"><span class="label">Q</span><output id="q">—</output></div>
      <div class="stat"><span class="label">ε</span><output id="epsilon">—</output></div>
      <div class="stat"><span class="label">Life losses</span><output id="life-losses">—</output></div>
      <div class="stat"><span class="label">Lives avg</span><output id="lives">—</output></div>
    </section>
    <section class="controls">
      <button data-control="pause">Pause</button>
      <button data-control="resume">Resume</button>
      <button data-control="stop">Stop</button>
    </section>
    <section class="replay">
      <div class="replay-controls">
        <select id="replays"><option value="">No replays</option></select>
        <input id="seed" type="number" min="0" max="32767" placeholder="seed">
        <button id="record">Record best</button>
        <button id="auto-play-latest" type="button" aria-pressed="false">Auto-play latest: Off</button>
      </div>
      <div class="replay-comparison" id="representative-replays" hidden>
        <span class="comparison-label">Training comparison</span>
        <button class="replay-role" data-replay-role="best" type="button">Best</button>
        <button class="replay-role" data-replay-role="mean" type="button">Mean</button>
        <button class="replay-role" data-replay-role="bad" type="button">Bad</button>
      </div>
      <canvas id="canvas" width="128" height="128"></canvas>
      <div class="replay-controls">
        <button id="play">Play</button>
        <input id="frame" type="range" min="0" max="0" value="0">
        <output id="frame-label">—</output>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const websocketPort = params.get("ws") || String(Number(location.port || 80) + 1);
    const websocketScheme = location.protocol === "https:" ? "wss" : "ws";
    const socketUrl = `${websocketScheme}://${location.hostname}:${websocketPort}`;
    const palette = [
      "#000000", "#1d2b53", "#7e2553", "#008751", "#ab5236", "#5f574f",
      "#c2c3c7", "#fff1e8", "#ff004d", "#ffa300", "#ffec27", "#00e436",
      "#29adff", "#83769c", "#ff77a8", "#ffccaa",
    ];
    const canvas = document.querySelector("#canvas");
    const context = canvas.getContext("2d");
    const socketState = document.querySelector("#state");
    const replaySelect = document.querySelector("#replays");
    const seedInput = document.querySelector("#seed");
    const frameInput = document.querySelector("#frame");
    const frameLabel = document.querySelector("#frame-label");
    const autoPlayButton = document.querySelector("#auto-play-latest");
    const representativeControls = document.querySelector("#representative-replays");
    const representativeButtons = [...document.querySelectorAll("[data-replay-role]")];
    let socket;
    let replay;
    let replayItems = [];
    let replayTimer;
    let autoPlayLatest = false;
    let autoPlayedReplayKey = "";

    function number(value, digits = 1) {
      return value == null || Number.isNaN(Number(value)) ? "—" : Number(value).toFixed(digits);
    }

    function send(message) {
      if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
    }

    function update(message) {
      const status = message.status || {};
      const record = status.record || {};
      socketState.textContent = status.state || "offline";
      document.querySelector("#step").textContent = `${status.step ?? 0}/${status.total_steps ?? 0}`;
      document.querySelector("#best").textContent = number(status.best_inner?.mean_survival_frames);
      document.querySelector("#train").textContent = number(status.final_training?.mean_survival_frames);
      document.querySelector("#holdout").textContent = number(status.final_holdout?.mean_survival_frames);
      document.querySelector("#replay-size").textContent = status.replay_size ?? "—";
      document.querySelector("#loss").textContent = number(record.loss, 4);
      document.querySelector("#q").textContent = number(record.q_mean);
      document.querySelector("#epsilon").textContent = number(record.epsilon, 3);
      document.querySelector("#life-losses").textContent = number(record.life_loss_count);
      document.querySelector("#lives").textContent = number(record.lives_remaining_mean);
      if (!seedInput.value && status.training_seeds?.length) seedInput.value = status.training_seeds[0];
      updateReplays(message.replays || []);
    }

    function updateReplays(replays) {
      const selected = replaySelect.value;
      replayItems = replays;
      replaySelect.replaceChildren();
      if (!replays.length) {
        replaySelect.add(new Option("No replays", ""));
        updateRepresentativeControls(replays);
        return;
      }
      for (const item of replays) {
        const mode = item.reset_mode ? ` · ${item.reset_mode}` : "";
        const role = item.replay_role ? `${roleName(item.replay_role)} · ` : "";
        const visualFrames = item.playback_frame_count ?? item.frame_count;
        const simulationFrames = Number(item.survival_frames);
        const duration = Number.isFinite(simulationFrames)
          ? `${visualFrames} visual / ${simulationFrames} sim`
          : `${visualFrames} visual`;
        const pixelStatus = item.pixel_regression?.status;
        const pixels = pixelStatus === "passed"
          ? " · pixels ✓"
          : pixelStatus ? " · pixels !" : " · pixels ?";
        const label = `${role}seed ${item.seed} · step ${item.checkpoint_step} · ${duration}${mode}${pixels}`;
        replaySelect.add(new Option(label, item.url));
      }
      const latest = latestReplay(replays);
      const selectedItem = replays.find(item => item.url === selected);
      const best = representativeReplay(replays, "best");
      const item = autoPlayLatest ? latest : (selectedItem || best || latest || replays[0]);
      replaySelect.value = item.url;
      updateRepresentativeControls(replays);
      const key = replayKey(item);
      const currentKey = replay ? replayKey(replay.item) : "";
      if (autoPlayLatest && latest && (key !== autoPlayedReplayKey || currentKey !== key)) {
        autoPlayedReplayKey = key;
        loadReplay(item, { autoplay: true });
      } else if (!replay && item) {
        loadReplay(item);
      } else if (replay && currentKey !== key && !autoPlayLatest) {
        loadReplay(item);
      }
    }

    function representativeReplay(replays, role) {
      return replays.find(item => item.replay_role === role);
    }

    function roleName(role) {
      return role ? role[0].toUpperCase() + role.slice(1) : "Replay";
    }

    function updateRepresentativeControls(replays) {
      let visible = false;
      representativeButtons.forEach(button => {
        const item = representativeReplay(replays, button.dataset.replayRole);
        button.hidden = !item;
        button.disabled = !item;
        if (item) {
          button.textContent = `${roleName(item.replay_role)} · seed ${item.seed} · ${item.survival_frames}f`;
          button.setAttribute("aria-pressed", String(item.url === replaySelect.value));
        } else {
          button.textContent = roleName(button.dataset.replayRole);
          button.setAttribute("aria-pressed", "false");
        }
        visible = visible || Boolean(item);
      });
      representativeControls.hidden = !visible;
    }

    function latestReplay(replays) {
      return replays.reduce((latest, item) => {
        if (!latest) return item;
        const itemCreated = Number(item.created_at);
        const latestCreated = Number(latest.created_at);
        if (Number.isFinite(itemCreated) && Number.isFinite(latestCreated) && itemCreated !== latestCreated) {
          return itemCreated > latestCreated ? item : latest;
        }
        const itemStep = Number(item.checkpoint_step) || 0;
        const latestStep = Number(latest.checkpoint_step) || 0;
        return itemStep >= latestStep ? item : latest;
      }, undefined);
    }

    function replayKey(item) {
      return `${item.url}:${item.created_at ?? ""}:${item.frame_count ?? ""}`;
    }

    async function loadReplay(item, { autoplay = false } = {}) {
      if (!item) return;
      stopPlayback();
      try {
        const response = await fetch(item.url, { cache: "no-store" });
        if (!response.ok) throw new Error(`replay fetch failed: ${response.status}`);
        const bytes = new Uint8Array(await response.arrayBuffer());
        const size = Number(item.frame_bytes) || (128 * 128);
        const start = Math.max(0, Number(item.playback_start) || 0);
        const declaredCount = Math.max(0, Number(item.playback_frame_count ?? item.frame_count) || 0);
        const available = Math.max(0, Math.floor(bytes.length / size) - start);
        const count = Math.min(declaredCount, available);
        const startFrame = Number(item.playback_start_frame);
        replay = {
          item,
          bytes,
          frameBytes: size,
          playbackStart: start,
          playbackCount: count,
          playbackStartFrame: Number.isFinite(startFrame) ? startFrame : null,
        };
      } catch (error) {
        replay = undefined;
        frameInput.max = 0;
        frameInput.value = 0;
        frameLabel.textContent = error instanceof Error ? error.message : "replay unavailable";
        return;
      }
      frameInput.max = Math.max(0, replay.playbackCount - 1);
      frameInput.value = 0;
      drawFrame();
      if (autoplay && replay.playbackCount > 0) startPlayback();
    }

    function drawFrame() {
      if (!replay || replay.playbackCount < 1) {
        context.clearRect(0, 0, 128, 128);
        frameLabel.textContent = "—";
        return;
      }
      const index = Math.min(replay.playbackCount - 1, Math.max(0, Number(frameInput.value)));
      frameInput.value = index;
      const offset = (replay.playbackStart + index) * replay.frameBytes;
      const size = replay.frameBytes;
      const pixels = replay.bytes.subarray(offset, offset + size);
      const image = context.createImageData(128, 128);
      for (let i = 0; i < pixels.length; i += 1) {
        const color = palette[pixels[i]] || palette[0];
        const value = parseInt(color.slice(1), 16);
        image.data[i * 4] = (value >> 16) & 255;
        image.data[i * 4 + 1] = (value >> 8) & 255;
        image.data[i * 4 + 2] = value & 255;
        image.data[i * 4 + 3] = 255;
      }
      context.putImageData(image, 0, 0);
      const stepFrames = Number(replay.item.step_frames || 1);
      const lastFrame = Number(replay.item.last_frame);
      const gameFrame = replay.playbackStartFrame == null
        ? (Number.isFinite(lastFrame)
          ? lastFrame - (replay.playbackCount - 1 - index) * stepFrames
          : (index + 1) * stepFrames)
        : replay.playbackStartFrame + (index + 1) * stepFrames;
      const end = Number.isFinite(lastFrame) ? `/${lastFrame}` : "";
      const survivalFrames = Number(replay.item.survival_frames);
      const survival = Number.isFinite(survivalFrames) ? ` · survival ${survivalFrames}` : "";
      frameLabel.textContent = `visual ${index + 1}/${replay.playbackCount} · game ${gameFrame}${end}${survival}`;
    }

    function stopPlayback() {
      if (replayTimer) {
        clearInterval(replayTimer);
        replayTimer = undefined;
        document.querySelector("#play").textContent = "Play";
      }
    }

    function startPlayback() {
      if (!replay) return;
      if (replay.playbackCount < 1) return;
      stopPlayback();
      const interval = Math.max(16, Math.round(1000 * Number(replay.item.step_frames || 1) / 60));
      replayTimer = setInterval(() => {
        if (Number(frameInput.value) >= Number(frameInput.max)) frameInput.value = 0;
        else frameInput.value = Number(frameInput.value) + 1;
        drawFrame();
      }, interval);
      document.querySelector("#play").textContent = "Pause";
    }

    function togglePlay() {
      if (replayTimer) stopPlayback();
      else startPlayback();
    }

    function updateAutoPlayButton() {
      autoPlayButton.textContent = `Auto-play latest: ${autoPlayLatest ? "On" : "Off"}`;
      autoPlayButton.setAttribute("aria-pressed", String(autoPlayLatest));
    }

    function connect() {
      socket = new WebSocket(socketUrl);
      socket.onopen = () => { socketState.textContent = "connected"; };
      socket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.type === "state") update(message);
        if (message.type === "error") socketState.textContent = message.message;
      };
      socket.onclose = () => {
        socketState.textContent = "offline";
        setTimeout(connect, 1000);
      };
    }

    document.querySelectorAll("[data-control]").forEach(button => {
      button.addEventListener("click", () => send({ type: "control", command: button.dataset.control }));
    });
    document.querySelector("#record").addEventListener("click", () => {
      const message = { type: "replay" };
      if (seedInput.value) message.seed = Number(seedInput.value);
      send(message);
    });
    replaySelect.addEventListener("change", () => {
      const item = replayItems.find(entry => entry.url === replaySelect.value);
      if (item) {
        updateRepresentativeControls(replayItems);
        loadReplay(item);
      }
    });
    representativeButtons.forEach(button => {
      button.addEventListener("click", () => {
        const item = representativeReplay(replayItems, button.dataset.replayRole);
        if (!item) return;
        replaySelect.value = item.url;
        updateRepresentativeControls(replayItems);
        loadReplay(item);
      });
    });
    autoPlayButton.addEventListener("click", () => {
      autoPlayLatest = !autoPlayLatest;
      updateAutoPlayButton();
      if (autoPlayLatest) {
        autoPlayedReplayKey = "";
        updateReplays(replayItems);
      }
    });
    frameInput.addEventListener("input", drawFrame);
    document.querySelector("#play").addEventListener("click", togglePlay);
    connect();
  </script>
</html>
