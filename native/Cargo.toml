[workspace]
resolver = "2"
members = [
    "crates/dodge-core",
    "crates/dodge-batch",
    "crates/dodge-kani",
    "crates/dodge-python",
    "crates/dodge-native-runner",
    "crates/dodge-viewer",
]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
