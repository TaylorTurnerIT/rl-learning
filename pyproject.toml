[project]
name = "rl-learning"
version = "0.1.0"
description = "A basic Python project managed with uv and devenv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neat-python>=2.0.0",
    "numpy>=2.4.6",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]

[project.scripts]
rl-learning = "rl_learning.main:main"
dodge-dataset-collect = "dodge.dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # basic style errors
    "F",   # likely bugs: unused imports, undefined names
    "I",   # import ordering
    "UP",  # modern Python improvements
    "B",   # common bug patterns
    "SIM", # unnecessarily complex code
]
