[project]
name = "rl-learning"
version = "0.1.0"
description = "A basic Python project managed with uv and devenv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10",
    "neat-python>=2.0.0",
    "numpy>=2.4.6",
    "pydantic>=2.0.0",
    "torch>=2.7",
    "websockets>=15.0",
]

[project.optional-dependencies]
native = ["dodge-native==0.1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.3",
]
gpu = [
    "marimo>=0.20",
]

[project.scripts]
rl-learning = "rl_learning.main:main"
dodge-dataset-collect = "dodge.dataset:main"
dodge-dataset-replay = "dodge.dataset:replay_main"
dodge-dataset-reconstruct = "dodge.dataset:reconstruct_main"
dodge-dataset-reset = "dodge.dataset:reset_main"
dodge-dataset-export = "dodge.dataset:export_main"
dodge-bc-train = "dodge.imitation.train:main"
dodge-bc-plot = "dodge.imitation.plot:main"
dodge-ppo-train = "dodge.rl.ppo:main"
dodge-native-oracle = "dodge.native.oracle:main"
dodge-native-probe = "dodge.native.probe:main"
dodge-native-extract-assets = "dodge.native.assets:main"
dodge-native-p2-report = "dodge.native.p2:main"
dodge-native-diff = "dodge.native.differential:main"
dodge-ng-manifest = "dodge.ng.manifest:main"
dodge-ng-train = "dodge.ng.train:main"
dodge-ng-report = "dodge.ng.report:main"
dodge-ng-diagnose-actions = "dodge.ng.diagnostics:main"
dodge-ng-diagnose-relevance = "dodge.ng.relevance:main"
dodge-ng-teacher = "dodge.ng.teacher:main"
dodge-ng-bc = "dodge.ng.bc:main"
dodge-ng-compare = "dodge.ng.compare:main"
dodge-ng-dagger = "dodge.ng.dagger:main"
dodge-ng-waypoint-feasibility = "dodge.ng.waypoint:main"
dodge-ng-dqn = "dodge.ng.dqn:main"
dodge-ng-replay = "dodge.ng.replay:main"
dodge-ng-dashboard = "dodge.ng.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/dodge/ng/dashboard.html" = "dodge/ng/dashboard.html"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv.sources]
dodge-native = { path = "native/crates/dodge-python" }

[tool.ruff.lint]
select = [
    "E",   # basic style errors
    "F",   # likely bugs: unused imports, undefined names
    "I",   # import ordering
    "UP",  # modern Python improvements
    "B",   # common bug patterns
    "SIM", # unnecessarily complex code
]
